<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京魔警録</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="works-page tokyo-makyo-page">
  <div id="site-header"></div>
  <main class="tmr-detail">
    <section class="tmr-hero" aria-labelledby="tmr-title">
      <img src="../assets/Logo25.png" alt="東京魔警録" class="tmr-logo" id="tmr-title">

      <div class="tmr-hero-frames" aria-label="メイン画面フレーム">
        <div class="tmr-phone-shot tmr-phone-shot--large">
          <img src="../assets/TMHome.png" alt="東京魔警録 ホーム画面">
        </div>
        <div class="tmr-phone-shot tmr-phone-shot--large">
          <img src="../assets/TMMission.png" alt="東京魔警録 任務画面">
        </div>
      </div>

      <p class="tmr-meta">CyberAgent 2024 サマーインターンシップ「UIDA」</p>
      <p class="tmr-award">優秀賞受賞</p>
    </section>

    <section class="tmr-section" aria-labelledby="tmr-workflow-title">
      <h2 class="tmr-pill" id="tmr-workflow-title">ワークフロー</h2>
      <div class="tmr-image-frame tmr-image-frame--workflow">
        <img src="../assets/TMWork.png" alt="東京魔警録 ワークフロー">
      </div>
    </section>

    <section class="tmr-section" aria-labelledby="tmr-design-title">
      <h2 class="tmr-pill" id="tmr-design-title">デザイン</h2>
      <div class="tmr-image-frame tmr-image-frame--design">
        <img src="../assets/TMDesign.jpg" alt="東京魔警録 デザイン資料">
      </div>
    </section>

    <section class="tmr-section" aria-labelledby="tmr-screen-title">
      <h2 class="tmr-pill" id="tmr-screen-title">画面遷移</h2>
      <div class="tmr-image-frame tmr-image-frame--game-screen">
        <img src="../assets/TMGameScreen.png" alt="東京魔警録 完成画面一覧">
      </div>
      <div class="tmr-screen-lead">
        <div class="tmr-image-frame tmr-image-frame--ui-main">
          <img src="../assets/TMUISketch1.jpg" alt="東京魔警録 画面遷移資料 1">
        </div>
        <div class="tmr-copy-block">
          <h3>キャラクター中心設計</h3>
          <p>ゲームへの入口としてキャラクターの魅力を伝え、育成・任務・ガチャなどの主要導線へ自然に移動できる構成にしています。</p>
          <h3>情報だけで組み立てる</h3>
          <p>画面ごとの目的を整理し、ユーザーが次に取る行動を迷わないように情報量と優先順位を調整しています。</p>
        </div>
      </div>
      <div class="tmr-screen-note-grid">
        <div class="tmr-image-frame">
          <img src="../assets/TMUISketch2.jpg" alt="東京魔警録 画面遷移資料 2">
        </div>
        <div class="tmr-image-frame">
          <img src="../assets/TMUISketch3.jpg" alt="東京魔警録 画面遷移資料 3">
        </div>
        <div class="tmr-image-frame">
          <img src="../assets/TMUISketch4.jpg" alt="東京魔警録 画面遷移資料 4">
        </div>
      </div>
    </section>

    <section class="tmr-section" aria-labelledby="tmr-assets-title">
      <h2 class="tmr-pill" id="tmr-assets-title">アセット</h2>
      <div class="tmr-assets-grid">
        <div class="tmr-image-frame tmr-image-frame--assets">
          <img src="../assets/TMAssets.png" alt="東京魔警録 アセット一覧">
        </div>
      </div>
    </section>
  </main>
  <script src="../load-header.js"></script>
</body>
</html>
