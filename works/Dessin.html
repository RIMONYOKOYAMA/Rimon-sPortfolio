<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高校のデッサン</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="works-page dessin-page">
  <div id="site-header"></div>
  <main class="wrapper">
    <div class="colors-detail dessin-detail">
      <section class="dessin-gallery" aria-label="高校のデッサン">
        <div class="dessin-gallery-row">
          <img src="../assets/DessinMars.png" alt="石膏像マルスのデッサン" class="dessin-gallery-image">
          <img src="../assets/DessinJeorge.png" alt="石膏像ジョルジョのデッサン" class="dessin-gallery-image">
        </div>
        <div class="dessin-gallery-row dessin-gallery-row--lower">
          <div class="dessin-gallery-column">
            <img src="../assets/DessinPerie.png" alt="静物のデッサン" class="dessin-gallery-image">
            <img src="../assets/DesinTire.png" alt="タイヤのデッサン" class="dessin-gallery-image">
          </div>
          <div class="dessin-gallery-column">
            <img src="../assets/DessinMike.png" alt="石膏像ミケランジェロのデッサン" class="dessin-gallery-image">
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="../load-header.js"></script>
  <script src="../icon-grid.js"></script>
  <script src="../scroll-fade.js"></script>
</body>
</html>
