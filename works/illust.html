<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イラスト集</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="works-page illust-page">
  <div id="site-header"></div>
  <main class="wrapper">
    <div class="colors-detail illust-detail">
      <section class="illust-gallery" aria-label="イラスト集">
        <div class="illust-gallery-row illust-gallery-row--top">
          <img src="../assets/illustDiner.png" alt="ダイナーをテーマにしたイラスト" class="illust-gallery-image">
          <img src="../assets/IllustAngel.pdf" alt="天使のイラスト" class="illust-gallery-image">
        </div>

        <div class="illust-gallery-row illust-gallery-row--feature">
          <img src="../assets/IllustMoon.png" alt="ムーンパレスのイラスト" class="illust-gallery-image">
          <img src="../assets/IllustChina.pdf" alt="チャイナ服のイラスト" class="illust-gallery-image">
        </div>

        <div class="illust-gallery-row illust-gallery-row--duo">
          <img src="../assets/IllustGoz.png" alt="ピンク髪のキャラクターイラスト" class="illust-gallery-image">
          <img src="../assets/IllustMez.png" alt="緑髪のキャラクターイラスト" class="illust-gallery-image">
        </div>

        <div class="illust-gallery-row illust-gallery-row--trio">
          <img src="../assets/IllustMoga.png" alt="モガ風のイラスト" class="illust-gallery-image">
          <img src="../assets/IllustHalloween.pdf" alt="ハロウィンのイラスト" class="illust-gallery-image">
          <img src="../assets/IllustGiraffe.png" alt="黄色をテーマにしたイラスト" class="illust-gallery-image">
        </div>
      </section>
    </div>
  </main>
  <script src="../load-header.js"></script>
  <script src="../icon-grid.js"></script>
</body>
</html>
