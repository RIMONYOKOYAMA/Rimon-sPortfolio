  <script src="../load-header.js"></script>
  <script>
    (() => {
      const items = [...document.querySelectorAll(".logo-grid-item")];
      const feature = document.querySelector(".logo-feature");
      const featureImg = document.querySelector(".logo-feature-img");
      const featurePlaceholder = document.querySelector(".logo-feature-placeholder");
      const prevButton = document.querySelector(".logo-slider-button--prev");
      const nextButton = document.querySelector(".logo-slider-button--next");
      let activeIndex = 0;
      let timerId;

      const getItemImage = (item) => item.querySelector("img");

      const showLogo = (index) => {
        activeIndex = (index + items.length) % items.length;
        const item = items[activeIndex];
        const img = getItemImage(item);
        const label = item.dataset.logoLabel || img?.alt || `Logo ${activeIndex + 1}`;

        items.forEach((gridItem, itemIndex) => {
          gridItem.classList.toggle("is-active", itemIndex === activeIndex);
        });

        feature.classList.remove("is-changing");
        requestAnimationFrame(() => {
          feature.classList.add("is-changing");
        });

        if (img?.getAttribute("src")) {
          featureImg.src = img.getAttribute("src");
          featureImg.alt = img.alt || label;
          featureImg.hidden = false;
          featurePlaceholder.hidden = true;
        } else {
          featureImg.removeAttribute("src");
          featureImg.alt = "";
          featureImg.hidden = true;
          featurePlaceholder.textContent = label;
          featurePlaceholder.hidden = false;
        }
      };

      const restartAutoSlide = () => {
        window.clearInterval(timerId);
        timerId = window.setInterval(() => showLogo(activeIndex + 1), 4200);
      };

      prevButton.addEventListener("click", () => {
        showLogo(activeIndex - 1);
        restartAutoSlide();
      });

      nextButton.addEventListener("click", () => {
        showLogo(activeIndex + 1);
        restartAutoSlide();
      });

      items.forEach((item, index) => {
        item.addEventListener("click", () => {
          showLogo(index);
          restartAutoSlide();
        });
      });

      showLogo(0);
      restartAutoSlide();
    })();
  </script>
