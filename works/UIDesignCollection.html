<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIデザイン集</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="works-page ui-collection-page">
  <div id="site-header"></div>
  <main class="ui-collection">
    <section class="ui-section ui-section--dark" aria-labelledby="ui-robot-title">
      <p class="ui-category-pill ui-category-pill--pink" id="ui-robot-title">3D ロボアクション</p>
      <div class="ui-frame-stack">
        <div class="ui-image-frame ui-image-frame--hero">
          <img src="../assets/UI1Title.jpg" alt="3Dロボアクション タイトルUI">
        </div>
        <div class="ui-image-frame ui-image-frame--wide">
          <img src="../assets/UI1Ingame.jpg" alt="3Dロボアクション インゲームUI">
        </div>
        <div class="ui-image-frame ui-image-frame--wide">
          <img src="../assets/UI1Custome.jpg" alt="3Dロボアクション カスタマイズUI">
        </div>

        <div class="ui-framework-layout">
          <div class="ui-framework-top">
            <div class="ui-image-frame ui-image-frame--framework">
              <img src="../assets/UI1Flamework1.jpg" alt="3Dロボアクション フレームワーク 1">
            </div>
            <div class="ui-image-frame ui-image-frame--framework">
              <img src="../assets/UI1Flamework2.jpg" alt="3Dロボアクション フレームワーク 2">
            </div>
          </div>
          <div class="ui-framework-bottom">
            <div class="ui-image-frame ui-image-frame--framework">
              <img src="../assets/UI1Flamework3.jpg" alt="3Dロボアクション フレームワーク 3">
            </div>
            <div class="ui-image-frame ui-image-frame--idea">
              <img src="../assets/UI1Idea.png" alt="3Dロボアクション アイデア資料">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="ui-section" aria-labelledby="ui-pop-title">
      <p class="ui-category-pill ui-category-pill--blue" id="ui-pop-title">対戦型リズムゲーム</p>
      <div class="ui-frame-stack ui-frame-stack--pop">
        <div class="ui-image-frame ui-image-frame--pop-main">
          <img src="../assets/UI2MainBisual.png" alt="対戦型リズムゲーム メインビジュアル">
        </div>
        <div class="ui-pop-grid">
          <div class="ui-image-frame ui-image-frame--pop-sub">
            <img src="../assets/UI2Home.png" alt="対戦型リズムゲーム ホーム画面">
          </div>
          <div class="ui-image-frame ui-image-frame--pop-sub">
            <img src="../assets/UI2CharaSelect.png" alt="対戦型リズムゲーム キャラクター選択画面">
          </div>
          <div class="ui-image-frame ui-image-frame--pop-sub">
            <img src="../assets/UI2Result.png" alt="対戦型リズムゲーム リザルト画面">
          </div>
          <div class="ui-image-frame ui-image-frame--pop-sub">
            <img src="../assets/UI2Ingame.png" alt="対戦型リズムゲーム インゲーム画面">
          </div>
        </div>
      </div>
    </section>

    <section class="ui-section" aria-labelledby="ui-rpg-title">
      <p class="ui-category-pill ui-category-pill--yellow" id="ui-rpg-title">RPG スマホゲーム</p>
      <div class="ui-frame-stack">
        <div class="ui-image-frame ui-image-frame--rpg">
          <img src="../assets/UI3Image.jpg" alt="RPGスマホゲーム UI画像">
        </div>
      </div>
    </section>
  </main>
  <script src="../load-header.js"></script>
  <script src="../scroll-fade.js"></script>
</body>
</html>
